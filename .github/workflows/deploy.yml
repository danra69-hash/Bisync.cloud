# Auto-deploy Bisync.cloud to Cloud Run when master is updated.
# One-time setup (from Windows, with gcloud logged in):
#   powershell -ExecutionPolicy Bypass -File .\scripts\setup-github-deploy.ps1
#
# Requires GitHub repository VARIABLES (not secrets):
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_SERVICE_ACCOUNT
# Uses Workload Identity Federation (no SA JSON keys - org-policy safe).

name: Deploy Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  # Cancel older in-flight deploys so a slow old build cannot overwrite a newer one.
  cancel-in-progress: true

# Least privilege by default (CKV2_GHA_1). Job still needs id-token for WIF.
permissions:
  contents: read

env:
  PROJECT_ID: project-8d670aa9-f439-44d9-8e1
  REGION: asia-southeast1
  SERVICE_NAME: bisync-cloud
  REPO_NAME: bisync
  SQL_INSTANCE: bisync-pg
  DB_USER: postgres
  DEV_CONSOLE_PATH: /dev/console

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node (deploy simulation)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup .NET (deploy simulation)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Pre-deploy simulation (related functions)
        run: |
          set -euo pipefail
          # Compare this commit to its parent so only related suites run.
          node scripts/run-deploy-simulation.mjs --phase=pre --base=HEAD~1

      - name: Verify brand assets before image build
        run: node scripts/verify-brand-assets.mjs

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.1.5

      - name: Resolve image tags & Cloud SQL connection
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}"
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "image_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          CONN="$(gcloud sql instances describe "${SQL_INSTANCE}" \
            --project="${PROJECT_ID}" \
            --format='value(connectionName)')"
          if [[ -z "${CONN}" ]]; then
            echo "Cloud SQL instance '${SQL_INSTANCE}' not found in project ${PROJECT_ID}" >&2
            exit 1
          fi
          echo "sql_connection=${CONN}" >> "$GITHUB_OUTPUT"
          echo "Using Cloud SQL: ${CONN}"
          echo "Images: ${IMAGE}:latest and ${IMAGE}:${SHA_SHORT}"

      - name: Build & push container (Cloud Build)
        run: |
          set -euo pipefail
          # Async + poll: streaming default Cloud Build logs fails for the
          # GitHub deploy SA (VPC-SC / logs bucket), which makes gcloud exit 1
          # even when the build is fine. Poll status via the Builds API instead.
          BUILD_ID="$(gcloud builds submit \
            --project="${PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --async \
            --format='value(id)' \
            --substitutions="_IMAGE=${{ steps.meta.outputs.image_latest }},_IMAGE_SHA=${{ steps.meta.outputs.image_sha }},_VITE_DEV_CONSOLE_PATH=${DEV_CONSOLE_PATH}" \
            .)"
          echo "Cloud Build id: ${BUILD_ID}"
          echo "Logs: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}"

          for i in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" \
              --project="${PROJECT_ID}" \
              --format='value(status)')"
            echo "[${i}] status=${STATUS}"
            case "${STATUS}" in
              SUCCESS)
                echo "Cloud Build succeeded"
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed: ${STATUS}" >&2
                gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format=json >&2 || true
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Cloud Build ${BUILD_ID}" >&2
          exit 1


      - name: Deploy to Cloud Run
        env:
          SQL_CONNECTION: ${{ steps.meta.outputs.sql_connection }}
          IMAGE: ${{ steps.meta.outputs.image_sha }}
        run: |
          set -euo pipefail
          DEFAULT_CONN="Host=/cloudsql/${SQL_CONNECTION};Database=bisync;Username=${DB_USER}"
          ARCHIVE_CONN="Host=/cloudsql/${SQL_CONNECTION};Database=bisync_archive;Username=${DB_USER}"
          AUDIT_CONN="Host=/cloudsql/${SQL_CONNECTION};Database=bisync_audit;Username=${DB_USER}"
          TAG_SUGGESTION_CONN="Host=/cloudsql/${SQL_CONNECTION};Database=bisync_tag_suggestions;Username=${DB_USER}"

          # Startup probe: give the revision ~4 minutes to bind PORT=8080 while
          # EnsureCreated/SchemaPatcher run, then deferred seeders continue after listen.
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=2 \
            --timeout=600 \
            --cpu-boost \
            --no-cpu-throttling \
            --startup-probe=tcpSocket.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=5,failureThreshold=48 \
            --add-cloudsql-instances="${SQL_CONNECTION}" \
            --set-secrets="DB_PASSWORD=bisync-db-password:latest" \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production" \
            --set-env-vars="ConnectionStrings__DefaultConnection=${DEFAULT_CONN}" \
            --set-env-vars="ConnectionStrings__ArchiveConnection=${ARCHIVE_CONN}" \
            --set-env-vars="ConnectionStrings__AuditConnection=${AUDIT_CONN}" \
            --set-env-vars="ConnectionStrings__TagSuggestionConnection=${TAG_SUGGESTION_CONN}" \
            --set-env-vars="DEV_CONSOLE_ENABLED=true" \
            --set-env-vars="BISYNC_GIT_SHA=${GITHUB_SHA}"

      - name: Verify health
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "Live URL: ${URL}"
          echo "Commit: ${GITHUB_SHA}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${URL}/api/health" | tee /tmp/health.json; then
              echo ""
              echo "Health OK"
              break
            fi
            echo "Health not ready yet (attempt ${i}/6), waiting 10s..."
            sleep 10
            if [[ "${i}" -eq 6 ]]; then
              echo "Health check failed" >&2
              exit 1
            fi
          done

          # Confirm this revision is the commit we just built (not a stale image).
          STATUS_JSON="$(curl -fsS "${URL}/api/dev-console/status")"
          echo "Dev Console status: ${STATUS_JSON}"
          echo "${STATUS_JSON}" | grep -q "${GITHUB_SHA}"

          # Dev Console APIs must return JSON, never the SPA HTML fallback.
          LS_CODE="$(curl -sS -o /tmp/launch-settings.json -w '%{http_code}' \
            -H 'Accept: application/json' \
            "${URL}/api/dev-console/launch-settings")"
          LS_TYPE="$(file -b --mime-type /tmp/launch-settings.json || true)"
          echo "launch-settings → HTTP ${LS_CODE} (${LS_TYPE})"
          test "${LS_CODE}" = "401"
          grep -q 'Dev Console session required' /tmp/launch-settings.json

          # SPA bundle must include current Dev Console tabs (catches stale wwwroot).
          # Download to a file first: with pipefail, `curl | grep -q` fails with curl 23
          # (SIGPIPE) whenever grep closes early after a match.
          INDEX_HTML="$(curl -fsS -H 'Cache-Control: no-cache' "${URL}/")"
          ASSET="$(printf '%s\n' "${INDEX_HTML}" | grep -oE '/assets/index-[^"]+\.js' | head -1)"
          echo "SPA asset: ${ASSET}"
          curl -fsS "${URL}${ASSET}" -o /tmp/spa-index.js
          grep -q 'Ref & Library' /tmp/spa-index.js

          # Favicon must be the Bisync chain mark, never the old purple Vite icon.
          echo "${INDEX_HTML}" | grep -qE 'favicon\.svg\?v='
          FAV_HREF="$(printf '%s\n' "${INDEX_HTML}" | grep -oE '/favicon\.svg\?v=[^"'\'' ]+' | head -1)"
          echo "Favicon: ${FAV_HREF}"
          curl -fsS -D /tmp/favicon.hdrs -o /tmp/favicon.svg "${URL}${FAV_HREF}"
          grep -q '#F37021' /tmp/favicon.svg
          grep -q 'M48 7H24a15 15 0 0 0 0 30h24' /tmp/favicon.svg
          if grep -qiE '863bff|aa3bff|vite-logo' /tmp/favicon.svg; then
            echo "Live favicon still contains legacy Vite mark" >&2
            exit 1
          fi
          grep -qiE 'no-store|no-cache' /tmp/favicon.hdrs

          # Deleted Vite scaffolding must not still be served from the image.
          for dead in /icons.svg /vite.svg /react.svg /hero.png; do
            CODE="$(curl -sS -o /tmp/dead.asset -w '%{http_code}' "${URL}${dead}")"
            TYPE="$(file -b --mime-type /tmp/dead.asset || true)"
            echo "dead asset ${dead} → HTTP ${CODE} (${TYPE})"
            if [[ "${CODE}" == "200" && "${TYPE}" == "image/svg+xml" ]]; then
              echo "Scaffolding asset still shipped: ${dead}" >&2
              exit 1
            fi
            if [[ "${CODE}" != "404" ]]; then
              # Must not MapFallback deleted icons to the SPA HTML as a fake 200.
              if [[ "${CODE}" == "200" ]] && grep -qi '<!doctype html' /tmp/dead.asset; then
                echo "Deleted asset ${dead} fell back to SPA HTML (must be real 404)" >&2
                exit 1
              fi
            fi
            test "${CODE}" = "404"
          done
          echo "Deploy verification OK"

      - name: Restore canonical Weissbrau floor plan
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "Ensuring Pavilion floor plan is authoritative on ${URL}"
          BASE_URL="${URL}" node scripts/restore-weissbrau-floor-plan.mjs

      - name: Post-deploy simulation (related functions)
        env:
          DEPLOY_SIM_BASE_URL: https://bisync-cloud-389272498937.asia-southeast1.run.app
          CHROME_PATH: /usr/bin/google-chrome-stable
          PLAYWRIGHT_CORE_PATH: /tmp/deploy-sim-pw/node_modules/playwright-core/index.js
        run: |
          set -euo pipefail
          mkdir -p /tmp/deploy-sim-pw
          npm install --prefix /tmp/deploy-sim-pw playwright-core@1.49.0 >/dev/null
          # Best-effort Chrome for /POS pageerror check (suite soft-skips if missing).
          sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable >/dev/null 2>&1 || true
          node scripts/run-deploy-simulation.mjs --phase=post --base=HEAD~1
